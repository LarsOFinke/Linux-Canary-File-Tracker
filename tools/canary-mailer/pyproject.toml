[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canary-mailer"
version = "0.1.0"
description = "SMTP mailer used by Linux Canary File Tracker actions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
canary-mailer = "app:main"

[tool.setuptools]
py-modules = ["app"]